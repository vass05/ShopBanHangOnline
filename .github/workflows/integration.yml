name: Frontend and backend integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit, database and concurrency tests
        working-directory: backend
        run: mvn --batch-mode clean test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-results
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build isolated Docker stack and test fixtures
        shell: pwsh
        run: ./scripts/Prepare-Integration.ps1
      - name: Browser, real database, Redis, RabbitMQ and captured SMTP
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect runtime diagnostics
        if: failure()
        run: docker compose --env-file .env.integration.local -f docker-compose.production.yml -f docker-compose.e2e.yml logs --no-color --tail 150 > integration-docker.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            integration-docker.log
          retention-days: 7
      - name: Stop this runner's integration stack, keeping volumes
        if: always()
        run: docker compose --env-file .env.integration.local -f docker-compose.production.yml -f docker-compose.e2e.yml down
