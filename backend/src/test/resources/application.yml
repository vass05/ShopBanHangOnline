spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    listener:
      simple:
        auto-startup: false

  mail:
    host: localhost
    port: 1025
    username: helishop.system@gmail.com
    password: testpassword
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  seeder:
    enabled: false
  cloudinary:
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret

